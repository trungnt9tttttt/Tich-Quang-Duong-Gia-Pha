<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gia Phả Tích Quang Đường</title>

<script src="https://unpkg.com/epubjs/dist/epub.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
}

.header{
    background:#1f2937;
    color:#fff;
    text-align:center;
    padding:12px;
}

#viewer{
    height:80vh;
}

#status{
    padding:10px;
    color:red;
}
</style>
</head>

<body>

<div class="header">
Gia Phả Tích Quang Đường
</div>

<div id="status">Đang tải EPUB...</div>

<div id="viewer"></div>

<script>

const status = document.getElementById("status");

try {

const book = ePub("./GP.epub");

book.ready.then(() => {
    status.innerHTML = "EPUB đã tải thành công";
});

book.loaded.navigation.then(() => {
    console.log("TOC Loaded");
});

const rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%"
});

rendition.display();

}
catch(err){
    status.innerHTML = "Lỗi: " + err;
}

</script>

</body>
</html>
