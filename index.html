<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tích Quang Đường Gia Phả</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #333333;
    }
    /* Đẩy iframe bung tuyệt đối 100% diện tích cửa sổ */
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <iframe 
    allowfullscreen="allowfullscreen" 
    allow="autoplay; fullscreen; clipboard-write" 
    scrolling="no" 
    src="https://heyzine.com/flip-book/8677d400e7.html">
  </iframe>
</body>
</html>
