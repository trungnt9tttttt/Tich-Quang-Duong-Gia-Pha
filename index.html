<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gia Phả Tích Quang Đường</title>

<script src="https://unpkg.com/epubjs/dist/epub.min.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#viewer {
    width: 100%;
    height: 100vh;
}

.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #1f2937;
    color: white;
    padding: 10px;
    text-align: center;
    z-index: 1000;
}

#viewer {
    margin-top: 40px;
    height: calc(100vh - 40px);
}
</style>

</head>

<body>

<div class="header">
    Gia Phả Tích Quang Đường
</div>

<div id="viewer"></div>

<script>
const book = ePub("GP.epub");

const rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%"
});

rendition.display();
</script>

</body>
</html>
